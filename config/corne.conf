# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# To enable USB logging, do NOT set CONFIG_ZMK_USB_LOGGING here -- it needs the
# cdc-acm devicetree node too. Add `snippet: zmk-usb-logging` in build.yaml instead.
# (This increases power usage significantly, turn it off when not in use.)

# TEMPORARY: nukes the entire BLE keyring on boot, including orphaned keys that
# BT_CLR / BT_CLR_ALL cannot reach (they skip profile slots with no stored address).
# Flash this to BOTH halves, boot both, then REMOVE this line and reflash both.
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

# Increasing the max number of allowed combos per key
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Increasing the max number of allowed keys per combo
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8
